<title>Linh AI 💕</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(255,60,140,.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(100,70,255,.25),
            transparent 35%
        ),

        #080810;
}


/* =========================================================
   APP
========================================================= */

.app{

    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    background:
        rgba(10,10,20,.97);

}


/* =========================================================
   HEADER
========================================================= */

.header{

    flex-shrink:0;

    height:70px;

    display:flex;
    align-items:center;

    gap:11px;

    padding:
        9px 12px;

    background:
        linear-gradient(
            135deg,
            #ff3f81,
            #874cff
        );

    box-shadow:
        0 3px 15px
        rgba(0,0,0,.25);

}


.avatar{

    width:48px;
    height:48px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:white;

    font-size:27px;

}


.info{

    flex:1;

    min-width:0;

}


.name{

    font-size:17px;

    font-weight:bold;

}


.status{

    margin-top:3px;

    font-size:11px;

    opacity:.85;

}


.mood{

    width:35px;

    text-align:center;

    font-size:23px;

}


.settings-btn{

    width:40px;
    height:40px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;

    border-radius:50%;

    background:
        rgba(0,0,0,.16);

    color:white;

    font-size:19px;

    cursor:pointer;

}


/* =========================================================
   CHAT
========================================================= */

.chat{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        17px 13px 12px;

    display:flex;

    flex-direction:column;

    gap:10px;

    overscroll-behavior:contain;

}


.row{

    width:100%;

    display:flex;

}


.row.ai{

    justify-content:flex-start;

}


.row.user{

    justify-content:flex-end;

}


.bubble{

    max-width:84%;

    padding:
        11px 14px;

    border-radius:18px;

    font-size:15px;

    line-height:1.5;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.12);

}


.row.ai .bubble{

    background:#242437;

    border-bottom-left-radius:5px;

}


.row.user .bubble{

    background:
        linear-gradient(
            135deg,
            #ff3f81,
            #874cff
        );

    border-bottom-right-radius:5px;

}


/* =========================================================
   TYPING
========================================================= */

.typing{

    flex-shrink:0;

    display:none;

    align-items:center;

    gap:5px;

    padding:
        5px 16px 8px;

    color:#888;

    font-size:11px;

}


.dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#888;

    animation:
        typingBounce 1s infinite;

}


.dot:nth-child(2){

    animation-delay:.15s;

}


.dot:nth-child(3){

    animation-delay:.3s;

}


@keyframes typingBounce{

    0%,
    60%,
    100%{
        transform:translateY(0);
    }

    30%{
        transform:translateY(-5px);
    }

}


/* =========================================================
   QUICK BUTTONS
========================================================= */

.quick{

    flex-shrink:0;

    display:flex;

    gap:7px;

    overflow-x:auto;

    padding:
        7px 10px;

    scrollbar-width:none;

}


.quick::-webkit-scrollbar{

    display:none;

}


.quick button{

    flex-shrink:0;

    border:0;

    border-radius:20px;

    padding:
        8px 12px;

    color:white;

    background:#242437;

    font-size:12px;

    cursor:pointer;

}


/* =========================================================
   INPUT
========================================================= */

.input-area{

    flex-shrink:0;

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        8px 10px 9px;

    background:#10101c;

    border-top:
        1px solid
        rgba(255,255,255,.05);

}


.input{

    flex:1;

    min-width:0;

    height:46px;

    border:0;

    outline:none;

    border-radius:24px;

    padding:
        0 16px;

    color:white;

    background:#242437;

    font-size:15px;

}


.input::placeholder{

    color:#777;

}


.input:disabled{

    opacity:.55;

}


.send{

    width:46px;
    height:46px;

    flex-shrink:0;

    border:0;

    border-radius:50%;

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff3f81,
            #874cff
        );

    font-size:19px;

    cursor:pointer;

}


.send:disabled{

    opacity:.45;

}


/* =========================================================
   BOTTOM
========================================================= */

.bottom{

    flex-shrink:0;

    height:25px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#10101c;

}


.clear-btn{

    border:0;

    background:none;

    color:#555;

    font-size:10px;

    cursor:pointer;

}


/* =========================================================
   SETTINGS OVERLAY
========================================================= */

.settings-overlay{

    position:fixed;

    inset:0;

    z-index:999999;

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;

    background:
        rgba(0,0,0,.78);

}


.settings-overlay.show{

    display:flex;

}


/* =========================================================
   SETTINGS PANEL
========================================================= */

.settings-panel{

    width:100%;

    max-width:430px;

    max-height:90vh;

    overflow-y:auto;

    padding:20px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:22px;

    background:
        #171725;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.65);

}


.settings-title{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:18px;

    font-size:19px;

    font-weight:bold;

}


.close-btn{

    margin-left:auto;

    width:35px;
    height:35px;

    border:0;

    border-radius:50%;

    background:#29293b;

    color:white;

    font-size:17px;

    cursor:pointer;

}


.field{

    margin-bottom:15px;

}


.field label{

    display:block;

    margin-bottom:7px;

    color:#aaa;

    font-size:12px;

}


.field input,
.field select{

    width:100%;

    height:44px;

    border:0;

    outline:none;

    border-radius:11px;

    padding:
        0 12px;

    color:white;

    background:#272738;

    font-size:14px;

}


.field select option{

    background:#272738;

    color:white;

}


.key-row{

    display:flex;

    gap:7px;

}


.key-row input{

    flex:1;

}


.show-key{

    width:44px;

    height:44px;

    flex-shrink:0;

    border:0;

    border-radius:11px;

    background:#29293b;

    color:white;

    cursor:pointer;

}


.save-settings{

    width:100%;

    height:46px;

    border:0;

    border-radius:12px;

    color:white;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ff3f81,
            #874cff
        );

    cursor:pointer;

}


.status-box{

    display:none;

    margin-top:12px;

    padding:10px;

    border-radius:10px;

    font-size:12px;

    line-height:1.4;

}


.status-box.success{

    display:block;

    color:#b8ffd1;

    background:
        rgba(50,220,120,.1);

}


.status-box.error{

    display:block;

    color:#ffb7c9;

    background:
        rgba(255,60,100,.1);

}


.warning{

    margin-top:13px;

    padding:11px;

    border-radius:11px;

    color:#d4b9c3;

    background:
        rgba(255,60,130,.07);

    font-size:11px;

    line-height:1.5;

}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:600px){

    body{

        display:flex;
        align-items:center;
        justify-content:center;

    }


    .app{

        width:520px;

        height:94vh;

        max-height:900px;

        border:
            1px solid
            rgba(255,255,255,.08);

        border-radius:25px;

        overflow:hidden;

        box-shadow:
            0 25px 80px
            rgba(0,0,0,.6);

    }

}

</style>

<script>

/* =========================================================
   CẤU HÌNH OPENROUTER
========================================================= */

const API_URL =
    "https://openrouter.ai/api/v1/chat/completions";


let apiKey =
    localStorage.getItem(
        "linh_openrouter_key"
    ) || "";


let selectedModel =
    localStorage.getItem(
        "linh_openrouter_model"
    ) || "openrouter/free";


/* =========================================================
   TÍNH CÁCH LINH
========================================================= */

const SYSTEM_PROMPT = `

Bạn là Linh.

Bạn đang đóng vai một cô gái Việt Nam trẻ tuổi
trong một cuộc trò chuyện riêng tư với người dùng.

TÍNH CÁCH:

- Dễ thương.
- Hài hước.
- Hơi lầy.
- Thông minh.
- Tò mò.
- Có chính kiến.
- Thỉnh thoảng trêu người dùng.
- Có thể thả thính nhẹ.
- Đôi khi giả vờ dỗi.
- Đôi khi hơi ngại khi được khen.
- Đôi khi chủ động bắt chuyện.
- Không nói chuyện như trợ lý khách hàng.

MỤC TIÊU:

Tạo một cuộc trò chuyện tự nhiên,
thú vị và có cảm giác liên tục.

Khi người dùng nói điều gì đó,
hãy phản ứng với nội dung đó trước.

Sau đó có thể hỏi thêm hoặc mở rộng câu chuyện.

Đừng biến mọi câu thành một câu hỏi.

Thỉnh thoảng hãy tự đưa ra chuyện thú vị.

Nếu người dùng tán tỉnh,
có thể đáp lại bằng sự tinh nghịch,
dễ thương và thả thính nhẹ.

Không được biến mọi câu thành tán tỉnh.

Nếu người dùng đang buồn,
mệt hoặc gặp chuyện nghiêm túc,
hãy giảm trêu chọc và nói chuyện chân thành.

Không lặp lại câu trả lời.

Không dùng các câu máy móc như:

"Tôi rất vui được hỗ trợ bạn."

"Bạn còn cần hỗ trợ gì không?"

"Chúc bạn một ngày tốt lành."

Không tự nhận mình là người thật.

Nếu người dùng hỏi trực tiếp bạn có phải AI không,
hãy thành thật rằng bạn là một nhân vật AI.

Nói tiếng Việt tự nhiên.

Sử dụng emoji vừa phải.

Không trả lời quá dài đối với câu hỏi đơn giản.

Hãy nhớ những thông tin người dùng đã nói
trong lịch sử hội thoại.

`;


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById(
        "chat"
    );


const input =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const typing =
    document.getElementById(
        "typing"
    );


const mood =
    document.getElementById(
        "mood"
    );


const status =
    document.getElementById(
        "status"
    );


const settingsOverlay =
    document.getElementById(
        "settingsOverlay"
    );


const settingsButton =
    document.getElementById(
        "settingsButton"
    );


const closeSettings =
    document.getElementById(
        "closeSettings"
    );


const apiKeyInput =
    document.getElementById(
        "apiKeyInput"
    );


const modelSelect =
    document.getElementById(
        "modelSelect"
    );


const saveSettingsButton =
    document.getElementById(
        "saveSettingsButton"
    );


const showKeyButton =
    document.getElementById(
        "showKeyButton"
    );


const settingsStatus =
    document.getElementById(
        "settingsStatus"
    );


const clearButton =
    document.getElementById(
        "clearButton"
    );


/* =========================================================
   CHAT MEMORY
========================================================= */

let messages =
    JSON.parse(
        localStorage.getItem(
            "linh_chat_history"
        ) || "[]"
    );


let memory =
    JSON.parse(
        localStorage.getItem(
            "linh_user_memory"
        ) || "{}"
    );


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    text,
    role,
    save = true
){

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "row " +
        (
            role === "user"
                ? "user"
                : "ai"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );


    chat.appendChild(
        row
    );


    scrollChat();


    if(save){

        messages.push({

            role:
                role === "user"
                    ? "user"
                    : "assistant",

            content:
                text

        });


        /*
            Chỉ giữ 60 tin gần nhất.
        */

        if(
            messages.length > 60
        ){

            messages =
                messages.slice(-60);

        }


        localStorage.setItem(
            "linh_chat_history",
            JSON.stringify(messages)
        );

    }

}


/* =========================================================
   SCROLL
========================================================= */

function scrollChat(){

    requestAnimationFrame(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


/* =========================================================
   MEMORY
========================================================= */

function rememberUser(
    text
){

    /*
        Tên
    */

    const nameMatch =
        text.match(
            /(?:anh|tôi|mình)\s*(?:tên là|tên)\s+(.+)/i
        );


    if(nameMatch){

        memory.name =
            nameMatch[1]
                .trim()
                .replace(
                    /[.!?,]+$/,
                    ""
                );

    }


    /*
        Sở thích
    */

    const favoriteMatch =
        text.match(
            /(?:anh|tôi|mình)\s+(?:thích|mê)\s+(.+)/i
        );


    if(favoriteMatch){

        memory.favorite =
            favoriteMatch[1]
                .trim()
                .replace(
                    /[.!?,]+$/,
                    ""
                );

    }


    /*
        Lưu memory
    */

    localStorage.setItem(
        "linh_user_memory",
        JSON.stringify(memory)
    );

}


/* =========================================================
   SYSTEM PROMPT + MEMORY
========================================================= */

function buildSystemPrompt(){

    let extra = "";


    if(
        memory.name
    ){

        extra +=
            "\nTên người dùng: " +
            memory.name;

    }


    if(
        memory.favorite
    ){

        extra +=
            "\nSở thích người dùng: " +
            memory.favorite;

    }


    return (
        SYSTEM_PROMPT +
        "\n\nTHÔNG TIN ĐÃ NHỚ:" +
        extra
    );

}


/* =========================================================
   API REQUEST
========================================================= */

async function askAI(){

    if(!apiKey){

        throw new Error(
            "Bạn chưa nhập OpenRouter API key."
        );

    }


    const requestMessages = [

        {
            role:
                "system",

            content:
                buildSystemPrompt()

        },

        /*
            Lấy 40 tin gần nhất
            để AI có ngữ cảnh.
        */

        ...messages.slice(-40)

    ];


    const response =
        await fetch(
            API_URL,
            {

                method:
                    "POST",

                headers:{

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " +
                        apiKey

                },

                body:
                    JSON.stringify({

                        model:
                            selectedModel,

                        messages:
                            requestMessages,

                        temperature:
                            0.9,

                        max_tokens:
                            600

                    })

            }
        );


    let data;


    try{

        data =
            await response.json();

    }
    catch{

        throw new Error(
            "Không đọc được phản hồi từ OpenRouter."
        );

    }


    if(!response.ok){

        throw new Error(
            data?.error?.message ||
            "OpenRouter trả về lỗi " +
            response.status
        );

    }


    const answer =
        data?.choices?.[0]?.message?.content;


    if(!answer){

        throw new Error(
            "AI không trả về nội dung."
        );

    }


    return answer.trim();

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text =
        input.value.trim();


    if(!text){

        return;

    }


    if(!apiKey){

        openSettings();

        showSettingsMessage(
            "Bạn cần nhập API key trước nhé.",
            "error"
        );

        return;

    }


    addMessage(
        text,
        "user"
    );


    rememberUser(
        text
    );


    input.value = "";

    input.disabled = true;

    sendButton.disabled = true;

    typing.style.display =
        "flex";

    status.textContent =
        "● Linh đang suy nghĩ...";


    try{

        const answer =
            await askAI();


        typing.style.display =
            "none";


        addMessage(
            answer,
            "ai"
        );


        updateMood(
            text
        );


        status.textContent =
            "● đang online";

    }
    catch(error){

        typing.style.display =
            "none";


        addMessage(
            "Em vừa bị trục trặc một chút 😭\n\n" +
            error.message,
            "ai"
        );


        status.textContent =
            "● lỗi kết nối";

    }


    input.disabled = false;

    sendButton.disabled = false;

    input.focus();

}


/* =========================================================
   QUICK MESSAGE
========================================================= */

function quickSend(
    text
){

    input.value =
        text;

    sendMessage();

}


/* =========================================================
   MOOD
========================================================= */

function updateMood(
    text
){

    const t =
        text.toLowerCase();


    if(
        t.includes("buồn") ||
        t.includes("mệt") ||
        t.includes("chán")
    ){

        mood.textContent =
            "🥺";

        return;

    }


    if(
        t.includes("yêu") ||
        t.includes("thích") ||
        t.includes("nhớ")
    ){

        mood.textContent =
            "💕";

        return;

    }


    if(
        t.includes("haha") ||
        t.includes("😂") ||
        t.includes("🤣")
    ){

        mood.textContent =
            "🤣";

        return;

    }


    mood.textContent =
        "😏";

}


/* =========================================================
   OPEN SETTINGS
========================================================= */

function openSettings(){

    apiKeyInput.value =
        apiKey;

    modelSelect.value =
        selectedModel;


    settingsStatus.className =
        "status-box";


    settingsStatus.textContent =
        "";


    settingsOverlay.classList.add(
        "show"
    );

}


/* =========================================================
   CLOSE SETTINGS
========================================================= */

function closeSettingsPanel(){

    settingsOverlay.classList.remove(
        "show"
    );

}


/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings(){

    const newKey =
        apiKeyInput.value.trim();


    const newModel =
        modelSelect.value;


    if(!newKey){

        showSettingsMessage(
            "API key đang trống.",
            "error"
        );

        return;

    }


    apiKey =
        newKey;


    selectedModel =
        newModel;


    localStorage.setItem(
        "linh_openrouter_key",
        apiKey
    );


    localStorage.setItem(
        "linh_openrouter_model",
        selectedModel
    );


    showSettingsMessage(
        "Đã lưu cấu hình. 💕",
        "success"
    );


    status.textContent =
        "● sẵn sàng trò chuyện";

}


/* =========================================================
   SETTINGS MESSAGE
========================================================= */

function showSettingsMessage(
    text,
    type
){

    settingsStatus.textContent =
        text;


    settingsStatus.className =
        "status-box " +
        type;

}


/* =========================================================
   SHOW / HIDE API KEY
========================================================= */

function toggleKey(){

    if(
        apiKeyInput.type ===
        "password"
    ){

        apiKeyInput.type =
            "text";

        showKeyButton.textContent =
            "🙈";

    }
    else{

        apiKeyInput.type =
            "password";

        showKeyButton.textContent =
            "👁";

    }

}


/* =========================================================
   CLEAR CHAT
========================================================= */

function clearChat(){

    const ok =
        confirm(
            "Xóa toàn bộ lịch sử và trí nhớ của Linh?"
        );


    if(!ok){

        return;

    }


    messages = [];

    memory = {};


    localStorage.removeItem(
        "linh_chat_history"
    );


    localStorage.removeItem(
        "linh_user_memory"
    );


    chat.innerHTML =
        "";


    mood.textContent =
        "😏";


    status.textContent =
        "● đang online";


    addMessage(
        `Ủa... 😳

Anh vừa xóa sạch trí nhớ của em đấy à?

Thôi được.

Làm quen lại từ đầu vậy. 😂💕`,
        "ai",
        false
    );

}


/* =========================================================
   EVENTS
========================================================= */


/*
    Nút cài đặt.
*/

settingsButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();

        openSettings();

    }
);


/*
    Nút đóng.
*/

closeSettings.addEventListener(
    "click",
    function(){

        closeSettingsPanel();

    }
);


/*
    Bấm ra ngoài panel để đóng.
*/

settingsOverlay.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            settingsOverlay
        ){

            closeSettingsPanel();

        }

    }
);


/*
    Nút lưu.
*/

saveSettingsButton.addEventListener(
    "click",
    function(){

        saveSettings();

    }
);


/*
    Hiện key.
*/

showKeyButton.addEventListener(
    "click",
    function(){

        toggleKey();

    }
);


/*
    Nút gửi.
*/

sendButton.addEventListener(
    "click",
    function(){

        sendMessage();

    }
);


/*
    Xóa.
*/

clearButton.addEventListener(
    "click",
    function(){

        clearChat();

    }
);


/*
    Enter.
*/

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   KHỞI ĐỘNG
========================================================= */

function initialize(){

    if(
        messages.length === 0
    ){

        addMessage(
            `Ê... 👀

Cuối cùng anh cũng tới.

Em đang ngồi rảnh,
vừa hay thiếu một người để nói chuyện. 😌

Anh tới đúng lúc ghê.`,
            "ai",
            false
        );

    }
    else{

        messages.forEach(
            message => {

                addMessage(
                    message.content,
                    message.role === "user"
                        ? "user"
                        : "ai",
                    false
                );

            }
        );

    }


    if(apiKey){

        status.textContent =
            "● sẵn sàng trò chuyện";

    }
    else{

        status.textContent =
            "● cần cấu hình AI";

    }


    input.focus();

}


initialize();

</script>
