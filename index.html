        <style>
            /* =========================================================

            /* =========================================================
               LOGIN
            ========================================================= */

                display:flex;
            
                align-items:center;

                        rgba(90,50,255,.25),
                        transparent 40%

            }
            
            
            .login-box{
            
                width:100%;
            
                max-width:400px;
            
                padding:28px;
            
                border:
                    1px solid
                    rgba(255,255,255,.1);

                cursor:pointer;
            
                transition:.2s;
            
            }

                transform:scale(.98);
            
            }
            
            
            .google-login:disabled{

            }
            
            
            .login-error{
            
                display:none;
            
                margin-bottom:12px;
            
                padding:11px;
            
                border-radius:10px;

                font-size:12px;

            }
            
            
            /* =========================================================
               APP
            ========================================================= */
            
            .app{
            
                width:100%;
            
                height:100dvh;
            
                display:flex;
            
                flex-direction:column;
            
                background:
            
                    radial-gradient(
                        circle at 10% 10%,
                        rgba(255,60,140,.12),
                        transparent 35%

            }
            
            
            /* =========================================================
               HEADER
            ========================================================= */
            
            .header{
            
                height:70px;
            
                flex-shrink:0;
            
                display:flex;
            
                align-items:center;
            
                gap:10px;

                        135deg,

                    );
            
            }
            
            
            .avatar{
            
                width:48px;

                flex-shrink:0;

                background:#fff;
            
                font-size:27px;
            
            }
            
            
            .info{
            
                flex:1;
            
                min-width:0;
            
            }
            
            
            .name{
            
                font-size:17px;
            
                font-weight:bold;
            
            }
            
            
            .status{

                font-size:11px;

            }
            
            
            .mood{

                text-align:center;

            }
            
            
            .header-button{

                    rgba(0,0,0,.16);

            }
            
            
            /* =========================================================
               CHAT
            ========================================================= */
            
            .chat{
            
                flex:1;
            
                min-height:0;
            
                overflow-y:auto;
            
                padding:
                    16px 13px;
            
                display:flex;
            
                flex-direction:column;
            
                gap:10px;
            
                scroll-behavior:smooth;
            
            }
            
            
            .row{
            
                width:100%;
            
                display:flex;
            
            }
            
            
            .row.ai{
            
                justify-content:flex-start;
            
            }
            
            
            .row.user{
            
                justify-content:flex-end;
            
            }
            
            
            .bubble{
            
                max-width:84%;
            
                padding:
                    11px 14px;
            
                border-radius:18px;
            
                font-size:15px;
            
                line-height:1.5;
            
                white-space:pre-wrap;
            
                overflow-wrap:anywhere;
            
            }
            
            
            .row.ai .bubble{
            
                background:#252538;
            
                border-bottom-left-radius:5px;
            
            }
            
            
            .row.user .bubble{
            
                background:
            
                    linear-gradient(
                        135deg,
                        #ff3f81,
                        #874cff
                    );
            
                border-bottom-right-radius:5px;
            
            }
            
            
            /* =========================================================
               TYPING
            ========================================================= */
            
            .typing{
            
                display:none;
            
                flex-shrink:0;
            
                align-items:center;
            
                gap:5px;
            
                padding:
                    5px 16px 8px;
            
                color:#888;
            
                font-size:11px;
            
            }
            
            
            .dot{
            
                width:6px;
            
                height:6px;
            
                border-radius:50%;
            
                background:#888;
            
                animation:
                    typing 1s infinite;
            
            }
            
            
            .dot:nth-child(2){
            
                animation-delay:.15s;
            
            }
            
            
            .dot:nth-child(3){
            
                animation-delay:.3s;
            
            }
            
            
            @keyframes typing{
            
                0%,
                60%,
                100%{
            
                    transform:
                        translateY(0);
            
                }
            
                30%{
            
                    transform:
                        translateY(-5px);
            
                }
            
            }
            
            
            /* =========================================================
               QUICK BUTTON
            ========================================================= */
            
            .quick{
            
                flex-shrink:0;

                gap:7px;
            
                overflow-x:auto;
            
                padding:

            /* =========================================================
               INPUT
            ========================================================= */

            }
            
            
            .message-input{
            
                flex:1;
            
                min-width:0;
            
                height:46px;
            
                border:0;
            
                outline:none;
            
                border-radius:24px;
            
                padding:

                background:#242437;

                font-size:15px;
            
            }
            
            
            .message-input::placeholder{
            
                color:#777;
            
            }
            
            
            .send-button{
            
                width:46px;
            
                height:46px;
            
                flex-shrink:0;
            
                border:0;
            
                border-radius:50%;
            
                background:
            
                    linear-gradient(
                        135deg,
                        #ff3f81,
                        #874cff
                    );
            
                color:#fff;
            
                font-size:19px;
            
            }
            
            
            .send-button:disabled{
            
                opacity:.45;
            
            }
            
            
            /* =========================================================
               BOTTOM
            ========================================================= */
            
            .bottom{
            
                height:27px;

                display:flex;
            
                align-items:center;
            
                justify-content:center;
            
                background:#10101c;
            
            }
            
            
            .clear-button{
            
                border:0;

                font-size:10px;
            
            }
            
            
            /* =========================================================
               SETTINGS
            ========================================================= */
            
            .overlay{
            
                position:fixed;
            
                inset:0;
            
                z-index:999998;
            
                display:none;
            
                align-items:center;
            
                justify-content:center;
            
                padding:18px;

                    rgba(0,0,0,.8);

            .panel{

            }

            }
            
            
            .close-button{
            
                width:35px;

                margin-left:auto;
            
                border:0;
            
                border-radius:50%;
            
                background:#29293b;

            }
            
            
            .account{
            
                margin-top:18px;
            
                padding:13px;
            
                border-radius:12px;

            .account-label{

            .account-email{

            .logout-button{
            
                width:100%;

            /* =========================================================
               MOBILE
            ========================================================= */
            
            @media(max-width:600px){
            
                .bubble{
            
                    max-width:88%;

                }

                }
            
                .avatar{
            
                    width:44px;
            
                    height:44px;
            
                    font-size:24px;
            
                }
            
            }
            
        </style>

        <!-- ======================================================

        <script type="module">
            /* ======================================================
               FIREBASE IMPORT
            ====================================================== */
            
            import {
            
                initializeApp
            
            }
            from
            "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
            
            
            import {
            
                getAuth,
            
                onAuthStateChanged,
            
                GoogleAuthProvider,
            
                signInWithPopup,
            
                signOut
            
            }
            from
            "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
            
            
            import {
            
                getFirestore,
            
                collection,
            
                addDoc,
            
                query,
            
                orderBy,
            
                onSnapshot,
            
                serverTimestamp,
            
                doc,
            
                setDoc,
            
                getDoc,
            
                getDocs,
            
                deleteDoc,
            
                limit
            
            }
            from
            "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
            
            
            import {
            
                getFunctions,
            
                httpsCallable
            
            }
            from
            "https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js";
            
            
            /* ======================================================
               FIREBASE CONFIG
            ======================================================
            
               Firebase Console
               →
               Project settings
               →
               Your apps
               →
               Web app
               →
               Config
            
               DÁN CONFIG CỦA BẠN VÀO ĐÂY.
            ====================================================== */
            
            const firebaseConfig = {
            
              const firebaseConfig = {
              apiKey: "AIzaSyBJ4-Gp0VkojKvMTbKRsGZhqYgQnCTd5lQ",
              authDomain: "linhai-cdc41.firebaseapp.com",
              projectId: "linhai-cdc41",
              storageBucket: "linhai-cdc41.firebasestorage.app",
              messagingSenderId: "312996602517",
              appId: "1:312996602517:web:356f1ede811446e821319c",
              measurementId: "G-GXEV242JQH"
            };
            
            
            /* ======================================================
               FIREBASE INIT
            ====================================================== */
            
            const firebaseApp =
                initializeApp(
                    firebaseConfig
                );
            
            
            const auth =
                getAuth(
                    firebaseApp
                );
            
            
            const db =
                getFirestore(
                    firebaseApp
                );
            
            
            /* ======================================================
               GOOGLE
            ====================================================== */
            
            const googleProvider =
                new GoogleAuthProvider();
            
            
            googleProvider.setCustomParameters({
            
                prompt:
                    "select_account"
            
            });
            
            
            /* ======================================================
               CLOUD FUNCTIONS
            ======================================================
            
               QUAN TRỌNG:
            
               Function phải có tên:
            
                   chatWithLinh
            
               Region ví dụ:
            
                   asia-southeast1
            
               API KEY OPENROUTER KHÔNG NẰM Ở ĐÂY.
            ====================================================== */
            
            const functions =
                getFunctions(
                    firebaseApp,
                    "asia-southeast1"
                );
            
            
            const chatWithLinh =
                httpsCallable(
                    functions,
                    "chatWithLinh"
                );
            
            
            /* ======================================================
               GLOBAL STATE
            ====================================================== */
            
            let currentUser =
                null;
            
            
            let unsubscribeMessages =
                null;
            
            
            let messages =
                [];
            
            
            let memory =
                {};
            
            
            /* ======================================================
               DOM
            ====================================================== */
            
            const loginScreen =
                document.getElementById(
                    "loginScreen"
                );
            
            
            const app =
                document.getElementById(
                    "app"
                );
            
            
            const googleLoginButton =
                document.getElementById(
                    "googleLoginButton"
                );
            
            
            const loginError =
                document.getElementById(
                    "loginError"
                );
            
            
            const chat =
                document.getElementById(
                    "chat"
                );
            
            
            const input =
                document.getElementById(
                    "messageInput"
                );
            
            
            const sendButton =
                document.getElementById(
                    "sendButton"
                );
            
            
            const typing =
                document.getElementById(
                    "typing"
                );
            
            
            const status =
                document.getElementById(
                    "status"
                );
            
            
            const mood =
                document.getElementById(
                    "mood"
                );
            
            
            const settingsButton =
                document.getElementById(
                    "settingsButton"
                );
            
            
            const settingsOverlay =
                document.getElementById(
                    "settingsOverlay"
                );
            
            
            const closeSettings =
                document.getElementById(
                    "closeSettings"
                );
            
            
            const accountEmail =
                document.getElementById(
                    "accountEmail"
                );
            
            
            const logoutButton =
                document.getElementById(
                    "logoutButton"
                );
            
            
            const clearButton =
                document.getElementById(
                    "clearButton"
                );
            
            
            /* ======================================================
               GOOGLE LOGIN
            ====================================================== */
            
            googleLoginButton.addEventListener(
            
                "click",
            
                async () => {
            
                    googleLoginButton.disabled =
                        true;
            
            
                    googleLoginButton.textContent =
                        "⏳ Đang đăng nhập...";
            
            
                    loginError.style.display =
                        "none";
            
            
                    try{
            
                        await signInWithPopup(
            
                            auth,
            
                            googleProvider
            
                        );
            
                    }
                    catch(error){
            
                        console.error(
                            error
                        );
            
            
                        loginError.textContent =
                            getAuthError(
                                error
                            );
            
            
                        loginError.style.display =
                            "block";
            
            
                        googleLoginButton.disabled =
                            false;
            
            
                        googleLoginButton.textContent =
                            "🔵 Đăng nhập bằng Google";
            
                    }
            
                }
            
            );
            
            
            /* ======================================================
               AUTH STATE
            ====================================================== */
            
            onAuthStateChanged(
            
                auth,
            
                async user => {
            
                    if(user){
            
                        currentUser =
                            user;
            
            
                        loginScreen.style.display =
                            "none";
            
            
                        app.style.display =
                            "flex";
            
            
                        accountEmail.textContent =
                            user.email ||
                            "Tài khoản Google";
            
            
                        status.textContent =
                            "● đang online";
            
            
                        await createUserDocument();
            
                        await loadMemory();
            
                        listenMessages();
            
                    }
                    else{
            
                        currentUser =
                            null;
            
            
                        if(
                            unsubscribeMessages
                        ){
            
                            unsubscribeMessages();
            
                            unsubscribeMessages =
                                null;
            
                        }
            
            
                        messages =
                            [];
            
            
                        memory =
                            {};
            
            
                        loginScreen.style.display =
                            "flex";
            
            
                        app.style.display =
                            "none";
            
                    }
            
                }
            
            );
            
            
            /* ======================================================
               AUTH ERROR
            ====================================================== */
            
            function getAuthError(
                error
            ){
            
                const code =
                    error?.code ||
                    "";
            
            
                if(
                    code ===
                    "auth/popup-closed-by-user"
                ){
            
                    return "Anh vừa mở cửa rồi đóng lại à 😭";
            
                }
            
            
                if(
                    code ===
                    "auth/popup-blocked"
                ){
            
                    return "Trình duyệt đã chặn cửa sổ Google. Hãy cho phép popup.";
            
                }
            
            
                if(
                    code ===
                    "auth/unauthorized-domain"
                ){
            
                    return "Domain này chưa được thêm vào Firebase Authentication.";
            
                }
            
            
                return (
                    error?.message ||
                    "Không thể đăng nhập Google."
                );
            
            }
            
            
            /* ======================================================
               CREATE USER
            ====================================================== */
            
            async function createUserDocument(){
            
                if(
                    !currentUser
                ){
            
                    return;
            
                }
            
            
                const userRef =
                    doc(
            
                        db,
            
                        "users",
            
                        currentUser.uid
            
                    );
            
            
                const snapshot =
                    await getDoc(
                        userRef
                    );
            
            
                if(
                    !snapshot.exists()
                ){
            
                    await setDoc(
            
                        userRef,
            
                        {
            
                            email:
                                currentUser.email ||
                                "",
            
                            name:
                                currentUser.displayName ||
                                "",
            
                            photoURL:
                                currentUser.photoURL ||
                                "",
            
                            memory:
                                {},
            
                            createdAt:
                                serverTimestamp(),
            
                            updatedAt:
                                serverTimestamp()
            
                        }
            
                    );
            
                }
            
            }
            
            
            /* ======================================================
               LOAD MEMORY
            ====================================================== */
            
            async function loadMemory(){
            
                if(
                    !currentUser
                ){
            
                    return;
            
                }
            
            
                const snapshot =
                    await getDoc(
            
                        doc(
            
                            db,
            
                            "users",
            
                            currentUser.uid
            
                        )
            
                    );
            
            
                if(
                    snapshot.exists()
                ){
            
                    memory =
                        snapshot.data().memory ||
                        {};
            
                }
                else{
            
                    memory =
                        {};
            
                }
            
            }
            
            
            /* ======================================================
               MESSAGE COLLECTION
            ====================================================== */
            
            function getMessagesCollection(){
            
                return collection(
            
                    db,
            
                    "users",
            
                    currentUser.uid,
            
                    "messages"
            
                );
            
            }
            
            
            /* ======================================================
               REALTIME FIRESTORE
            ====================================================== */
            
            function listenMessages(){
            
                if(
                    !currentUser
                ){
            
                    return;
            
                }
            
            
                if(
                    unsubscribeMessages
                ){
            
                    unsubscribeMessages();
            
                }
            
            
                const q =
                    query(
            
                        getMessagesCollection(),
            
                        orderBy(
                            "createdAt",
                            "asc"
                        ),
            
                        limit(200)
            
                    );
            
            
                unsubscribeMessages =
            
                    onSnapshot(
            
                        q,
            
                        snapshot => {
            
                            chat.innerHTML =
                                "";
            
            
                            messages =
                                [];
            
            
                            snapshot.forEach(
            
                                item => {
            
                                    const data =
                                        item.data();
            
            
                                    if(
                                        !data.content
                                    ){
            
                                        return;
            
                                    }
            
            
                                    messages.push({
            
                                        role:
                                            data.role,
            
                                        content:
                                            data.content
            
                                    });
            
            
                                    addBubble(
            
                                        data.content,
            
                                        data.role
            
                                    );
            
                                }
            
                            );
            
            
                            if(
                                messages.length === 0
                            ){
            
                                showWelcome();
            
                            }
            
                        },
            
                        error => {
            
                            console.error(
                                error
                            );
            
            
                            status.textContent =
                                "● lỗi Firestore";
            
                        }
            
                    );
            
            }
            
            
            /* ======================================================
               WELCOME
            ====================================================== */
            
            function showWelcome(){
            
                addBubble(
            
            `Ê... 👀
            
            Cuối cùng anh cũng tới.
            
            Em đang ngồi rảnh,
            vừa hay thiếu một người để nói chuyện. 😌
            
            Anh tới đúng lúc ghê.`,
            
                    "assistant"
            
                );
            
            }
            
            
            /* ======================================================
               ADD BUBBLE
            ====================================================== */
            
            function addBubble(
                text,
                role
            ){
            
                const row =
                    document.createElement(
                        "div"
                    );
            
            
                row.className =
                    role === "user"
                        ? "row user"
                        : "row ai";
            
            
                const bubble =
                    document.createElement(
                        "div"
                    );
            
            
                bubble.className =
                    "bubble";
            
            
                bubble.textContent =
                    text;
            
            
                row.appendChild(
                    bubble
                );
            
            
                chat.appendChild(
                    row
                );
            
            
                requestAnimationFrame(
            
                    () => {
            
                        chat.scrollTop =
                            chat.scrollHeight;
            
                    }
            
                );
            
            }
            
            
            /* ======================================================
               SAVE MESSAGE
            ====================================================== */
            
            async function saveMessage(
            
                role,
            
                content
            
            ){
            
                if(
                    !currentUser
                ){
            
                    return;
            
                }
            
            
                await addDoc(
            
                    getMessagesCollection(),
            
                    {
            
                        role:
                            role,
            
                        content:
                            content,
            
                        createdAt:
                            serverTimestamp(),
            
                        userId:
                            currentUser.uid
            
                    }
            
                );
            
            }
            
            
            /* ======================================================
               MEMORY
            ====================================================== */
            
            async function detectMemory(
                text
            ){
            
                let changed =
                    false;
            
            
                const nameMatch =
                    text.match(
            
                        /(?:anh|tôi|mình)\s*(?:tên là|tên)\s+(.+)/i
            
                    );
            
            
                if(
                    nameMatch
                ){
            
                    memory.name =
            
                        nameMatch[1]
            
                            .trim()
            
                            .replace(
                                /[.!?,]+$/,
                                ""
                            );
            
            
                    changed =
                        true;
            
                }
            
            
                const favoriteMatch =
                    text.match(
            
                        /(?:anh|tôi|mình)\s+(?:thích|mê)\s+(.+)/i
            
                    );
            
            
                if(
                    favoriteMatch
                ){
            
                    memory.favorite =
            
                        favoriteMatch[1]
            
                            .trim()
            
                            .replace(
                                /[.!?,]+$/,
                                ""
                            );
            
            
                    changed =
                        true;
            
                }
            
            
                if(
                    !changed
                ){
            
                    return;
            
                }
            
            
                await setDoc(
            
                    doc(
            
                        db,
            
                        "users",
            
                        currentUser.uid
            
                    ),
            
                    {
            
                        memory:
                            memory,
            
                        updatedAt:
                            serverTimestamp()
            
                    },
            
                    {
                        merge:true
                    }
            
                );
            
            }
            
            
            /* ======================================================
               SEND MESSAGE
            ====================================================== */
            
            sendButton.addEventListener(
            
                "click",
            
                sendMessage
            
            );
            
            
            input.addEventListener(
            
                "keydown",
            
                event => {
            
                    if(
                        event.key ===
                        "Enter"
                    ){
            
                        event.preventDefault();
            
                        sendMessage();
            
                    }
            
                }
            
            );
            
            
            async function sendMessage(){
            
                const text =
                    input.value.trim();
            
            
                if(
                    !text ||
                    !currentUser
                ){
            
                    return;
            
                }
            
            
                input.value =
                    "";
            
            
                input.disabled =
                    true;
            
            
                sendButton.disabled =
                    true;
            
            
                typing.style.display =
                    "flex";
            
            
                status.textContent =
                    "● Linh đang nghĩ...";
            
            
                try{
            
                    /*
                       Lưu user message trước.
                    */
            
                    await saveMessage(
            
                        "user",
            
                        text
            
                    );
            
            
                    /*
                       Cập nhật memory.
                    */
            
                    await detectMemory(
                        text
                    );
            
            
                    /*
                       Gửi lên Cloud Function.
            
                       KHÔNG CÓ API KEY Ở ĐÂY.
                    */
            
                    const result =
            
                        await chatWithLinh({
            
                            messages:
            
                                [
                                    ...messages.slice(-40),
            
                                    {
                                        role:
                                            "user",
            
                                        content:
                                            text
                                    }
            
                                ],
            
                            memory:
                                memory,
            
                            user:
            
                                {
            
                                    uid:
                                        currentUser.uid,
            
                                    email:
                                        currentUser.email ||
                                        "",
            
                                    name:
                                        currentUser.displayName ||
                                        ""
            
                                }
            
                        });
            
            
                    const answer =
                        result?.data?.answer;
            
            
                    if(
                        !answer
                    ){
            
                        throw new Error(
            
                            "Cloud Function không trả về câu trả lời."
            
                        );
            
                    }
            
            
                    /*
                       Lưu câu trả lời AI.
                    */
            
                    await saveMessage(
            
                        "assistant",
            
                        answer
            
                    );
            
            
                    updateMood(
                        text
                    );
            
            
                    status.textContent =
                        "● đang online";
            
                }
                catch(error){
            
                    console.error(
                        error
                    );
            
            
                    console.error(
                        "AI ERROR:",
                        error
                    );
            
            
                    /*
                       Không hiển thị API key
                       hoặc thông tin server.
                    */
            
                    await saveMessage(
            
                        "assistant",
            
                        "Em bị trục trặc một chút 😭\n\n" +
                        "Không kết nối được với AI."
            
                    );
            
            
                    status.textContent =
                        "● AI đang lỗi";
            
                }
            
            
                typing.style.display =
                    "none";
            
            
                input.disabled =
                    false;
            
            
                sendButton.disabled =
                    false;
            
            
                input.focus();
            
            }
            
            
            /* ======================================================
               MOOD
            ====================================================== */
            
            function updateMood(
                text
            ){
            
                const t =
                    text.toLowerCase();
            
            
                if(
            
                    t.includes("buồn") ||
            
                    t.includes("mệt")
            
                ){
            
                    mood.textContent =
                        "🥺";
            
                }
                else if(
            
                    t.includes("yêu") ||
            
                    t.includes("nhớ") ||
            
                    t.includes("thích")
            
                ){
            
                    mood.textContent =
                        "💕";
            
                }
                else if(
            
                    t.includes("haha") ||
            
                    t.includes("😂") ||
            
                    t.includes("🤣")
            
                ){
            
                    mood.textContent =
                        "🤣";
            
                }
                else{
            
                    mood.textContent =
                        "😏";
            
                }
            
            }
            
            
            /* ======================================================
               QUICK SEND
            ====================================================== */
            
            window.quickSend =
            
                function(text){
            
                    input.value =
                        text;
            
                    sendMessage();
            
                };
            
            
            /* ======================================================
               SETTINGS
            ====================================================== */
            
            settingsButton.addEventListener(
            
                "click",
            
                () => {
            
                    settingsOverlay.classList.add(
                        "show"
                    );
            
                }
            
            );
            
            
            closeSettings.addEventListener(
            
                "click",
            
                () => {
            
                    settingsOverlay.classList.remove(
                        "show"
                    );
            
                }
            
            );
            
            
            settingsOverlay.addEventListener(
            
                "click",
            
                event => {
            
                    if(
                        event.target ===
                        settingsOverlay
                    ){
            
                        settingsOverlay.classList.remove(
                            "show"
                        );
            
                    }
            
                }
            
            );
            
            
            /* ======================================================
               LOGOUT
            ====================================================== */
            
            logoutButton.addEventListener(
            
                "click",
            
                async () => {
            
                    await signOut(
                        auth
                    );
            
            
                    settingsOverlay.classList.remove(
                        "show"
                    );
            
                }
            
            );
            
            
            /* ======================================================
               CLEAR CHAT
            ====================================================== */
            
            clearButton.addEventListener(
            
                "click",
            
                async () => {
            
                    if(
                        !currentUser
                    ){
            
                        return;
            
                    }
            
            
                    const confirmDelete =
                        confirm(
            
                            "Xóa toàn bộ lịch sử trò chuyện?"
            
                        );
            
            
                    if(
                        !confirmDelete
                    ){
            
                        return;
            
                    }
            
            
                    try{
            
                        const snapshot =
            
                            await getDocs(
            
                                query(
            
                                    getMessagesCollection(),
            
                                    limit(500)
            
                                )
            
                            );
            
            
                        for(
                            const item
                            of snapshot.docs
                        ){
            
                            await deleteDoc(
                                item.ref
                            );
            
                        }
            
            
                        memory =
                            {};
            
            
                        await setDoc(
            
                            doc(
            
                                db,
            
                                "users",
            
                                currentUser.uid
            
                            ),
            
                            {
            
                                memory:
                                    {},
            
                                updatedAt:
                                    serverTimestamp()
            
                            },
            
                            {
                                merge:true
                            }
            
                        );
            
            
                        chat.innerHTML =
                            "";
            
            
                        showWelcome();
            
                    }
                    catch(error){
            
                        console.error(
                            error
                        );
            
            
                        alert(
                            "Không thể xóa lịch sử."
                        );
            
                    }
            
                }
            
            );
            
            
        </script>

    </body>

</html>
